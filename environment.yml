# Conda environment for PRISM (CUDA 12.8 / torch 2.8 baseline).
#
# One-shot (recommended):
#   bash scripts/setup_env.sh
#
# Conda-only alternative (creates env, then run setup script for pip deps):
#   conda env create -f environment.yml
#   conda activate prism
#   bash scripts/setup_env.sh

name: prism
channels:
  - defaults

dependencies:
  - python=3.10
  - pip>=23.0
